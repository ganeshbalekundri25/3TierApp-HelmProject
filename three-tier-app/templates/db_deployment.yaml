apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}

spec:
  serviceName: db-service

  replicas: {{ .Values.database.replicas }}

  selector:
    matchLabels:
      app: mongo

  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: db-component
          image: {{ .Values.database.image }}

          envFrom:
            - configMapRef:
                name: db-configmap

          volumeMounts:
            - name: mongo-persistent-storage
              mountPath: /data/db

          ports:
            - containerPort: 27017

  volumeClaimTemplates:
    - metadata:
        name: mongo-persistent-storage
      spec:
        storageClassName: microk8s-hostpath
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi